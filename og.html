<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <title>社交预览图生成源 · 1280×640 · rnadow.top</title>
  <!--
    og-image.png 的生成源文件：浏览器打开本页（本地服务器），
    将视口设为 1280×640 后截图，即可得到 og-image.png。
    想换文案 / 配色，改下面内联样式后重新截图即可。
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1280px; height: 640px; overflow: hidden; }
    body {
      position: relative;
      background: #0e1016;
      color: #e7e9f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      align-items: center;
      padding: 0 96px;
    }

    .glow1, .glow2 { position: absolute; border-radius: 50%; filter: blur(90px); }
    .glow1 { width: 520px; height: 520px; top: -180px; left: -120px; background: rgba(91, 94, 244, 0.28); }
    .glow2 { width: 460px; height: 460px; bottom: -160px; right: -100px; background: rgba(176, 110, 245, 0.22); }

    .dots {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(124, 128, 255, 0.13) 1.5px, transparent 1.5px);
      background-size: 32px 32px;
    }

    .card { position: relative; display: flex; align-items: center; gap: 64px; }

    .avatar-wrap { position: relative; flex-shrink: 0; }
    .avatar {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5b5ef4, #b06ef5);
      display: grid;
      place-items: center;
      font-size: 84px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 24px 60px rgba(91, 94, 244, 0.35);
      border: 6px solid rgba(255, 255, 255, 0.06);
    }
    .status {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #34d399;
      border: 6px solid #0e1016;
    }

    .name-row { display: flex; align-items: baseline; gap: 10px; }
    .name {
      font-size: 112px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(120deg, #8a8dff, #c084fc);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    .tld { font-size: 56px; font-weight: 600; color: #7c80ff; letter-spacing: -0.02em; }

    .tagline { margin-top: 18px; font-size: 30px; color: #98a0b3; }

    .chips { display: flex; gap: 16px; margin-top: 34px; }
    .chip {
      padding: 10px 22px;
      border-radius: 999px;
      border: 1px solid rgba(124, 128, 255, 0.4);
      background: rgba(124, 128, 255, 0.08);
      color: #b9bcff;
      font-size: 22px;
      white-space: nowrap;
    }
    .chip strong { color: #e7e9f0; font-weight: 600; }

    .footer {
      position: absolute;
      left: 96px;
      right: 96px;
      bottom: 44px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #6b7387;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="glow1"></div>
  <div class="glow2"></div>
  <div class="dots"></div>

  <div class="card">
    <div class="avatar-wrap">
      <div class="avatar">r</div>
      <div class="status"></div>
    </div>
    <div>
      <div class="name-row">
        <span class="name">rnadow</span>
        <span class="tld">.top</span>
      </div>
      <div class="tagline">白天写代码，晚上折腾服务器</div>
      <div class="chips">
        <span class="chip">🌐 <strong>rnadow.top</strong></span>
        <span class="chip">📝 技术笔记</span>
        <span class="chip">🛠 自托管</span>
        <span class="chip">☕ 生活随想</span>
      </div>
    </div>
  </div>

  <div class="footer">
    <span>© 2026 rnadow 的小站</span>
    <span>无广告 · 无追踪 · RSS 全文输出</span>
  </div>
</body>
</html>
