<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · 页面走丢了 | rnadow.top</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%235b5ef4'/%3E%3Ctext x='50' y='71' font-size='56' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'%3Er%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0e1016;
      --text: #e7e9f0;
      --muted: #98a0b3;
      --accent: #7c80ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse 60% 40% at 30% 10%, rgba(124, 128, 255, 0.14), transparent), var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      text-align: center;
      padding: 24px;
    }
    .code {
      font-size: clamp(72px, 18vw, 140px);
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(120deg, var(--accent), #b06ef5);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      line-height: 1.1;
    }
    h1 { font-size: 1.25rem; margin: 12px 0 8px; font-weight: 700; }
    p { color: var(--muted); font-size: 0.95rem; line-height: 1.8; }
    a {
      display: inline-block;
      margin-top: 26px;
      padding: 10px 26px;
      border-radius: 999px;
      background: linear-gradient(120deg, var(--accent), #b06ef5);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.2s;
    }
    a:hover { transform: translateY(-2px); }
    .mail { display: inline; margin: 10px 0 0; padding: 0; background: none; color: var(--accent); font-weight: 400; }
    .mail:hover { transform: none; text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>页面走丢了</h1>
    <p>你访问的页面不存在，或者已经被挪走了。</p>
    <a href="/">回首页看看</a>
    <p>也可以写信告诉我：<a class="mail" href="mailto:i@rnadow.top">i@rnadow.top</a></p>
  </main>
</body>
</html>
